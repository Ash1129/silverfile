[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "silverfile"
version = "0.1.0"
description = "SilverFile: a multi-agent preparation aid for Form 1040-SR drafts (Kushim proof of concept)."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
