<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}SilverFile{% endblock %} — Kushim dashboard</title>
<link rel="stylesheet" href="/static/style.css">
{% block head %}{% endblock %}
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="/">SilverFile <span>Kushim preparer dashboard</span></a>
    <nav><a href="/">All returns</a>{% if request.state.key_session %}<form method="post" action="/key/forget"><button class="linkish" type="submit" title="Drop your API key from this server's memory">Forget my key</button></form>{% endif %}</nav>
  </div>
</header>
<div class="draft-strip">{{ BANNER }}</div>
<main class="wrap">
{% block content %}{% endblock %}
</main>
<footer class="wrap muted">SilverFile prepares drafts for a Kushim preparer to check. It never files a return and never gives tax advice.</footer>
</body>
</html>
