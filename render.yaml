# One-click deploy to Render (https://render.com): New > Blueprint > pick this repo.
# No ANTHROPIC_API_KEY is set here on purpose. The shared copy starts in offline mode
# (scripted intake, sidecar extraction, rule-only review on the demo fixtures) and any
# visitor can paste their own Anthropic key into the header's "API key" control to run the
# live models for their session (see src/silverfile/dashboard/gate.py); the owner's key
# stays in the local .env. To make a key mandatory before any page, add
# SILVERFILE_REQUIRE_KEY=1 here.
# Secrets are generated by Render and never in git: the data key (encryption at rest and the
# integrity HMAC) and the first admin's password, which the owner reads in Render's dashboard.
services:
  - type: web
    name: silverfile
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: SILVERFILE_DATA_DIR
        value: /data
      - key: SILVERFILE_SEED_DEMO   # seed six demo returns on first start so the list is not empty
        value: "1"
      - key: SILVERFILE_DATA_KEY    # required in production (the Dockerfile sets SILVERFILE_ENV=production)
        generateValue: true
      - key: SILVERFILE_ADMIN_USER
        value: admin
      - key: SILVERFILE_ADMIN_PASSWORD
        generateValue: true
      - key: FORWARDED_ALLOW_IPS    # trust Render's proxy headers so cookies are marked Secure
        value: "*"
